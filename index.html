<style>
:root{font-family:Inter,system-ui,sans-serif;color:#173831;background:#f3f5ee;font-synthesis:none}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #427c46;outline-offset:3px}
header{background:#173831;color:#fff;padding:34px 20px 39px}header div{max-width:970px;margin:auto;display:flex;align-items:center;gap:16px}header img{width:65px;height:65px;border:1px solid #6da794;border-radius:18px}h1{margin:0;font-size:clamp(32px,6vw,49px);letter-spacing:-.06em;line-height:1}header p{color:#c5ded1;margin:7px 0 0;font-size:14px}
main{max-width:1010px;margin:auto;padding:24px 20px 40px}.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}.bar button{border:1px solid #d4dfd4;background:#fff;border-radius:20px;padding:9px 15px;font-size:14px;font-weight:650}.bar [aria-pressed=true]{background:#173831;color:white;border-color:#173831}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{background:#fff;border:1px solid #dbe4d8;border-radius:19px;padding:19px;display:flex;flex-direction:column;gap:12px;min-width:0}.card[hidden], [hidden]{display:none!important}.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.tag{color:#375d48;font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.08em}.star,.swap{border:1px solid #dbe4d8;background:#f6f8f2;border-radius:10px;min-width:40px;height:40px;font-size:21px}.star[aria-pressed=true]{background:#e4f6ba;color:#244813}.card h2{font-size:21px;letter-spacing:-.035em;margin:-9px 0 0}.fields,.units{display:flex;align-items:end;gap:8px}.fields label,.units label{min-width:0;flex:1}label{display:block;font-size:12px;font-weight:650}input,select{width:100%;height:41px;border:1px solid #c9d8cc;background:#fff;border-radius:9px;margin-top:4px;padding:0 9px;font-size:16px}input::placeholder{color:#6c7c72}
.result{min-height:57px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#e9f5d6;border-radius:10px;padding:10px;margin-top:auto}.result output{font-size:clamp(16px,3vw,23px);font-weight:750;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}.copy{background:#fff;border:1px solid #cbdab8;border-radius:8px;padding:7px;font-size:12px}.copy:disabled{opacity:.55;cursor:default}.note{margin:0;font-size:13px;color:#735013}details{font-size:13px;color:#436052}summary{cursor:pointer}details p{margin:8px 0 0;overflow-wrap:anywhere}

  {name:'Velmi velká', mark:'特大', pa:2.4769e-3, water:41.17, limit:.64},
  {name:'Největší', mark:'超特大', pa:4.7372e-3, limit:.88}
];
const orificeCalculator = {
  id:'orifice', category:'Průtok', title:'Průtok z manometru',
  fields:['Odečet manometru (h)'],
  formula:'Pa: Q = √(h × k) · mmH₂O: Q = √(h ÷ C)',
  calculate([reading], index, unit) {
    if (reading < 0) return {note:'Zadej nezáporný odečet manometru.'};
    const orifice = orifices[index];
    const water = unit === 'mmH₂O';
    const converted = water && orifice.water === undefined;
    const pa = converted ? reading / .1020 : reading;
    const directWater = water && !converted;
    const value = directWater ? Math.sqrt(reading / orifice.water) : Math.sqrt(pa * orifice.pa);
    const work = directWater ? '√(' + display(reading) + ' ÷ ' + display(orifice.water) + ')' :
      '√(' + display(pa) + ' × ' + display(orifice.pa) + ')';
    const notes = [];
    if (value > orifice.limit + 1e-12) notes.push(translate('Překročen rozsah clony') + ' (' + display(orifice.limit) + ' m³/min).');
    if (value >= .33 - 1e-12) notes.push(translate('Od 0,33 m³/min upozorňuje štítek na omezení pro trubku Ø60 mm.'));
    if (converted) notes.push(translate('Pro největší clonu se odečet přepočítá na Pa podle štítku (1 Pa = 0,1020 mmH₂O).'));
    return {value, unit:'m³/min', work, note:notes.join(' ')};
  }
};
const configs = [
  converters('flow', 'Průtok', 'Převod průtoku', airflow),
  orificeCalculator,
  converters('pressure', 'Tlak', 'Převod statického tlaku', pressure),
  {
    id:'noise', category:'Hluk', title:'Fan ON / Fan OFF',
    fields:['Fan ON · dB(A)', 'Fan OFF · dB(A)'],
    formula:'L ventilátoru = L ON + 10 × log₁₀(1 − 10^((L OFF − L ON) / 10)).',
    calculate([on, off]) {
      const difference = on - off;
      if (difference <= 0) return {note:'Fan ON musí být vyšší než Fan OFF.'};
      const value = on + 10 * Math.log10(-Math.expm1(-difference * Math.LN10 / 10));
      return {value, unit:'dB(A)', work:display(on) + ' + 10 × log₁₀(1 − 10^(−' + display(difference) + ' / 10))',
        note:difference < 3 ? 'Rozdíl je menší než 3 dB. Výsledek je citlivý na chybu měření.' : ''};
    }
  },
  {
    id:'bpf', category:'Hluk', title:'Frekvence lopatek (BPF)',
    fields:['Otáčky · RPM', 'Počet lopatek'],
    formula:'Frekvence v Hz = otáčky za minutu ÷ 60 × počet lopatek.',
    calculate([rpm, blades]) {
      if (rpm < 0 || !Number.isSafeInteger(blades) || blades < 1) return {note:'Zadej nezáporné otáčky a kladný celý počet lopatek.'};
      return {value:rpm / 60 * blades, unit:'Hz', work:display(rpm) + ' ÷ 60 × ' + display(blades)};
    }
  }
];
let saved = [];
try {
  const stored = JSON.parse(localStorage.getItem('fan-calc-favorites') || '[]');
  if (Array.isArray(stored)) saved = stored;
} catch {}
const favorites = new Set(saved);
const grid = document.querySelector('#cards');
const filters = [...document.querySelectorAll('[data-filter]')];
let filter = 'all';
function number(text) {
  const clean = text.trim().replace(/[\s\u00a0\u202f]/g, '').replace(',', '.').replace('−', '-');
  return /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?$/i.test(clean) ? Number(clean) : NaN;
}
const cards = configs.map(config => {
  const card = document.createElement('article');
  card.className = 'card';
  const units = config.factors ? Object.keys(config.factors) : [];
  const options = units.map(unit => '<option>' + unit + '</option>').join('');
  card.innerHTML = '<div class="card-head"><span class="tag">' + config.category + '</span><button type="button" class="star"></button></div><h2>' + config.title + '</h2>' +
    (config === orificeCalculator ? '<div class="units orifice"><label>Clona<select>' +
      orifices.map((orifice, index) => '<option value="' + index + '">' + orifice.name + ' · ' + orifice.mark + '</option>').join('') +
      '</select></label><label>Jednotka manometru<select><option>Pa</option><option>mmH₂O</option></select></label></div>' : '') +
    '<div class="fields">' + config.fields.map(field => '<label>' + field + '<input inputmode="decimal" autocomplete="off" placeholder="Zadej hodnotu"></label>').join('') + '</div>' +
    (units.length ? '<div class="units"><label>Z jednotky<select>' + options + '</select></label><button class="swap" type="button" aria-label="Otočit směr převodu">⇄</button><label>Na jednotku<select>' + options + '</select></label></div>' : '') +
    '<div class="result"><output aria-live="polite">—</output><button class="copy" type="button" disabled>Kopírovat</button></div><p class="note" role="status" hidden></p><details><summary>Vzorec</summary><p>' + config.formula + '</p><p class="work" hidden></p></details>';
  const inputs = [...card.querySelectorAll('input')];
  const [from, to] = card.querySelectorAll('select');
  const star = card.querySelector('.star');
  const output = card.querySelector('output');
  const note = card.querySelector('.note');
  const copy = card.querySelector('.copy');
  const work = card.querySelector('.work');
  const unitLabels = card.querySelectorAll('.units label');
  const swap = card.querySelector('.swap');
  function localize() {
    card.querySelector('.tag').textContent = translate(config.category);
    card.querySelector('h2').textContent = translate(config.title);
    for (const [i, input] of inputs.entries()) {
      input.parentElement.firstChild.nodeValue = translate(config.fields[i]);
      input.placeholder = translate('Zadej hodnotu');
    }
    if (config === orificeCalculator) {
      unitLabels[0].firstChild.nodeValue = translate('Clona');
      unitLabels[1].firstChild.nodeValue = translate('Jednotka manometru');
      for (const [index, option] of [...from.options].entries()) {
        const orifice = orifices[index];
        option.textContent = translate(orifice.name) + ' · ' + orifice.mark;
      }
    }
    if (swap) {
      unitLabels[0].firstChild.nodeValue = translate('Z jednotky');
      unitLabels[1].firstChild.nodeValue = translate('Na jednotku');
      swap.setAttribute('aria-label', translate('Otočit směr převodu'));
    }
    card.querySelector('summary').textContent = translate('Vzorec');
    card.querySelector('details p').textContent = translate(config.formula);
    update();
  }
  if (swap) to.selectedIndex = units.length - 1;
  function update() {
    const values = inputs.map(input => number(input.value));
    const result = values.every(Number.isFinite) ? config.calculate(values, from?.value, to?.value) : {};
    const valid = Number.isFinite(result.value);
    output.textContent = valid ? display(result.value) + ' ' + result.unit : '—';
    copy.disabled = !valid;
    copy.textContent = translate('Kopírovat');
    const message = result.note || (result.value !== undefined && !valid ? 'Výsledek je mimo rozsah.' : '') ||
      (inputs.some((input, i) => input.value.trim() && !Number.isFinite(values[i])) ? 'Zkontroluj zadané číslo.' : '');
    note.textContent = translate(message);
    note.hidden = !message;
    work.hidden = !valid;
    work.textContent = valid ? result.work + ' = ' + output.textContent : '';
  }
  card.addEventListener('input', update);
  card.addEventListener('change', update);
  swap?.addEventListener('click', () => {
    [from.value, to.value] = [to.value, from.value];
    update();
  });
  copy.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(output.textContent);
      copy.textContent = translate('Zkopírováno');
    } catch {
      const selection = window.getSelection();
      selection.selectAllChildren(output);
      copy.textContent = translate('Označeno');
    }
  });
  star.addEventListener('click', () => {
    if (favorites.has(config.id)) favorites.delete(config.id);
    else favorites.add(config.id);
    try { localStorage.setItem('fan-calc-favorites', JSON.stringify([...favorites])); } catch {}
    render();
  });
  grid.append(card);
  return {config, card, star, localize};
});
function render() {
  let visible = 0;
  for (const {config, card, star} of cards) {
    const pinned = favorites.has(config.id);
    star.textContent = pinned ? '★' : '☆';
    star.setAttribute('aria-pressed', pinned);
    star.setAttribute('aria-label', translate(pinned ? 'Odebrat z oblíbených: ' : 'Přidat do oblíbených: ') + translate(config.title));
    card.style.order = pinned ? -1 : 0;
    card.hidden = !(filter === 'all' || (filter === 'favorites' && pinned) || filter === config.category);
    if (!card.hidden) visible++;
  }
  document.querySelector('#empty').hidden = visible > 0;
  for (const button of filters) button.setAttribute('aria-pressed', button.dataset.filter === filter);
}
for (const button of filters) button.addEventListener('click', () => {
  filter = button.dataset.filter;
  render();
});
const languageButton = document.querySelector('#language');
const filterLabels = ['Vše', '☆ Oblíbené', 'Průtok', 'Tlak', 'Hluk'];
function applyLanguage() {
  document.documentElement.lang = language;
  languageButton.textContent = language === 'en' ? 'EN / CZ' : 'CZ / EN';
  languageButton.setAttribute('aria-label', language === 'en' ? 'Přepnout do češtiny' : 'Switch to English');
  document.querySelector('header p').textContent = translate('Průtok, tlak a hluk ventilátorů');
  document.querySelector('nav').setAttribute('aria-label', translate('Kategorie kalkulaček'));
  document.querySelector('#empty').textContent = translate('Hvězdičkou připneš kalkulačku mezi oblíbené.');
  for (const [i, button] of filters.entries()) button.textContent = translate(filterLabels[i]);
  for (const {localize} of cards) localize();
  render();
}
languageButton.addEventListener('click', () => {
  language = language === 'cs' ? 'en' : 'cs';
  try { localStorage.setItem('fan-calc-language', language); } catch {}
  applyLanguage();
});
applyLanguage();
</script>
</body>
</html>
